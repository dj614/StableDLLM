# MMaDA task overlay: GSM8K.
#
# Apply on top of the MDM base config:
#   --config src/configs/mdm/train_mmada_base.yaml \
#   --config MMaDA/configs/mmada_t2i.yaml

train:
  task: t2i
  train_data_path: ./data/train/t2i.jsonl
  train_mode: MIRROR
  PPOTS: True
  # e.g. 1 node with 8 gpus: global_batch_size = 8 * 4 * 1 = 32
  batch_size_per_gpu: 4
  grad_accum: 1