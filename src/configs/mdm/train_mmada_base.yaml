# Base training config for the MDM framework (engine = mmada_plus).
#
# This file is intended to be task-agnostic and shared across masked-diffusion
# tasks that reuse the MMaDA+ training runner.
#
# Typical usage (base + overlay):
#
#   PYTHONPATH=src:. python -m mdm.train \
#       --config src/configs/mdm/train_mmada_base.yaml \
#       --config MMaDA/configs/mmada_t2i.yaml

engine: mmada_plus

# Optional global mirror toggle. The runner also accepts train.china.
china: false

train:
  # Required fields for the mmada_plus runner.
  seed: 42
  task: null  # provided by task overlays under MMaDA/configs/ (or via --set)
  batch_size_per_gpu: 1
  grad_accum: 1

  # Runner options (see src/mdm/engines/mmada_plus/cli/train.py)
  model: mmada
  train_mode: Normal
  PPOTS: false
  p_model: EPR

  # Diffusion / importance sampling controls
  max_tokens_per_forward: 60000
  max_is_weight: 1000000.0
  n_starts: 20
  num_samples_x0: 10
  num_samples_t: 30
  num_samples_xt: 10
  mix_uniform: 0.0

  # Data
  train_data_path: null
  max_len: 4096
  epochs: 5
  train_ratio: 0.9

  # Optim
  lr_scheduler_type: linear
  lr: 5.0e-5
  warmup_steps: 0

  # Eval / checkpoint
  eval_strategy: epoch
  eval_steps: null

  save_strategy: last
  save_steps: 200

  output_dir: null
  logging_steps: 5

  china: false